<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cinemaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="600" height="380" rx="16" fill="url(#cinemaBg)" />
  <rect width="600" height="42" rx="16" fill="#1e293b" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="110" y="10" width="380" height="22" rx="6" fill="#0f172a" />
  <text x="130" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">cineticket.app/seats/screen-1</text>

  <!-- Cinema Movie Banner Header -->
  <rect x="24" y="58" width="552" height="64" rx="10" fill="#1e293b" />
  <rect x="36" y="68" width="44" height="44" rx="6" fill="#e11d48" />
  <text x="48" y="96" fill="#fff" font-family="system-ui, sans-serif" font-size="20">🎬</text>
  <text x="92" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">CineTicket • Cinema Seat Reservation</text>
  <text x="92" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cinema 3 • 2D Dolby Atmos • Screening: 7:30 PM</text>

  <!-- Cinema Curved Screen Visual -->
  <path d="M 120 148 Q 300 134 480 148" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 120 148 Q 300 134 480 148 L 460 178 Q 300 164 140 178 Z" fill="url(#screenGrad)" />
  <text x="260" y="143" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="2">CINEMA SCREEN</text>

  <!-- Interactive Seat Grid -->
  <!-- Row A -->
  <g transform="translate(140, 185)">
    <rect x="0" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="28" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="56" y="0" width="22" height="20" rx="4" fill="#ef4444" />
    <rect x="84" y="0" width="22" height="20" rx="4" fill="#ef4444" />
    <rect x="130" y="0" width="22" height="20" rx="4" fill="#10b981" />
    <rect x="158" y="0" width="22" height="20" rx="4" fill="#10b981" />
    <rect x="186" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="232" y="0" width="22" height="20" rx="4" fill="#ef4444" />
    <rect x="260" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="288" y="0" width="22" height="20" rx="4" fill="#334155" />
  </g>

  <!-- Row B -->
  <g transform="translate(140, 212)">
    <rect x="0" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="28" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="56" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="84" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="130" y="0" width="22" height="20" rx="4" fill="#38bdf8" />
    <rect x="158" y="0" width="22" height="20" rx="4" fill="#38bdf8" />
    <rect x="186" y="0" width="22" height="20" rx="4" fill="#38bdf8" />
    <rect x="232" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="260" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="288" y="0" width="22" height="20" rx="4" fill="#ef4444" />
  </g>

  <!-- Row C -->
  <g transform="translate(140, 239)">
    <rect x="0" y="0" width="22" height="20" rx="4" fill="#ef4444" />
    <rect x="28" y="0" width="22" height="20" rx="4" fill="#ef4444" />
    <rect x="56" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="84" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="130" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="158" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="186" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="232" y="0" width="22" height="20" rx="4" fill="#334155" />
    <rect x="260" y="0" width="22" height="20" rx="4" fill="#38bdf8" />
    <rect x="288" y="0" width="22" height="20" rx="4" fill="#38bdf8" />
  </g>

  <!-- Legend & Bottom Ticket Checkout Card -->
  <rect x="24" y="278" width="552" height="86" rx="10" fill="#1e293b" />
  
  <!-- Legend dots -->
  <rect x="42" y="294" width="12" height="12" rx="3" fill="#334155" />
  <text x="60" y="304" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Available</text>

  <rect x="132" y="294" width="12" height="12" rx="3" fill="#ef4444" />
  <text x="150" y="304" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Reserved</text>

  <rect x="222" y="294" width="12" height="12" rx="3" fill="#38bdf8" />
  <text x="240" y="304" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Selected (B5, B6, B7)</text>

  <!-- Price Summary & Checkout Button -->
  <text x="42" y="340" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">3 Tickets • <strong>Total: ₱1,050.00</strong></text>
  
  <rect x="420" y="296" width="140" height="50" rx="8" fill="#e11d48" />
  <text x="446" y="326" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Book Seats ➔</text>
</svg>
