<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background Circle with glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="175" fill="#0f172a" />
  
  <!-- Stylized Tech Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="url(#avatarGrad)" />
  <!-- Body / Shoulders -->
  <path d="M120 280 C120 220, 280 220, 280 280 C280 300, 120 300, 120 280 Z" fill="url(#avatarGrad)" />
  
  <!-- Tech Glasses / Code Badge -->
  <rect x="165" y="142" width="30" height="15" rx="4" fill="#0f172a" />
  <rect x="205" y="142" width="30" height="15" rx="4" fill="#0f172a" />
  <line x1="195" y1="148" x2="205" y2="148" stroke="#0f172a" stroke-width="3" />
  
  <!-- Subtle Code Bracket Accent -->
  <text x="75" y="210" fill="#38bdf8" font-family="monospace" font-size="44" font-weight="bold">&lt;/&gt;</text>
  <text x="285" y="210" fill="#818cf8" font-family="monospace" font-size="44" font-weight="bold">{;}</text>
</svg>
